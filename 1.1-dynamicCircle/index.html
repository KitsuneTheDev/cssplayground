<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Circle</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./index.js"></script>
</head>
<body>
    <div class="dynamic-circle-outer">
        <div class="dynamic-circle-inner">
            <span class="dynamic-circle">
                <img class="lines" src="./vectors/BlackUncompleted.svg" alt="">
                <svg class="timer-svg" viewBox="0 0 100 100">
                    <circle class="circle-path" cx="50" cy="50" r="40" />
                    <circle class="placeholder" cx="50" cy="50" r="40" />
                </svg>
            </span>
        </div>
    </div>
</body>
</html>
