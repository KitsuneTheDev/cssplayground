<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Bars</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <main class="main-container">
        <section class="floating-bars-section">
            <div class="content-wrapper">
                <svg viewbox="0 0 100% 100%">
                    <line x1="0%" x2="100%" y1="48%" y2="48%" stroke="black" stroke-width="2" stroke-dasharray="2%" />

                    <rect x="0" y="5%" rx="2.5%" width="5%" height="90%" />
                    <line class="bar" x1="2.5%" x2="2.5%" y1="8.625%" y2="91.225%" data-day="1" pathLength="24"/>

                    <rect x="15.83%" y="5%" rx="2.5%" width="5%" height="90%" fill="grey" />
                    <line class="bar" x1="18.23%" x2="18.23%" y1="8.625%" y2="91.225%" data-day="2" pathLength="24"/>

                    <rect x="31.66%" y="5%" rx="2.5%" width="5%" height="90%" fill="grey" />
                    <line class="bar" x1="34.16%" x2="34.16%" y1="8.625%" y2="91.225%" data-day="3" pathLength="24"/>

                    <rect x="47.49%" y="5%" rx="2.5%" width="5%" height="90%" fill="grey" />
                    <line class="bar" x1="49.99%" x2="49.99%" y1="8.625%" y2="91.225%" data-day="4" pathLength="24"/>

                    <rect x="63.42%" y="5%" rx="2.5%" width="5%" height="90%" fill="grey" />
                    <line class="bar" x1="65.92%" x2="65.92%" y1="8.625%" y2="91.225%" data-day="5" pathLength="24"/>

                    <rect x="79.15%" y="5%" rx="2.5%" width="5%" height="90%" fill="grey" />
                    <line class="bar" x1="81.65%" x2="81.65%" y1="8.625%" y2="91.225%" data-day="6" pathLength="24"/>

                    <rect x="94.98%" y="5%" rx="2.5%" width="5%" height="90%" fill="grey" />
                    <line class="bar" x1="97.48%" x2="97.48%" y1="8.625%" y2="91.225%" data-day="7" pathLength="24"/>

                </svg>
            </div>
        </section>
    </main>
</body>
</html>
